<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tetris — Dual Engine</title>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #eee; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  canvas { background: #000; border: 2px solid #444; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .box { border: 1px solid #444; padding: 10px; text-align: center; }
  .score { font-size: 22px; }
  .label { font-size: 11px; color: #888; letter-spacing: 1px; }
  button { background: #222; color: #eee; border: 1px solid #555; padding: 8px 14px; cursor: pointer; font-family: monospace; }
  button:hover { background: #333; }
  /* toggle switch */
  .switch { position: relative; display: inline-block; width: 60px; height: 30px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #555; border-radius: 30px; transition: .3s; }
  .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background: #eee; border-radius: 50%; transition: .3s; }
  input:checked + .slider { background: #00a000; }
  input:checked + .slider:before { transform: translateX(30px); }
  .engine-label { font-size: 11px; color: #888; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="board" width="240" height="480"></canvas>
  <div class="panel">
    <div class="box">
      <div class="label">NEXT</div>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="box">
      <div class="label">SCORE</div>
      <div class="score" id="score">0</div>
    </div>
    <div class="box">
      <div class="label">LINES</div>
      <div class="score" id="lines">0</div>
    </div>
    <div class="box">
      <div class="label">ENGINE</div>
      <label class="switch">
        <input type="checkbox" id="engineToggle">
        <span class="slider"></span>
      </label>
      <div class="engine-label" id="engineName">Functional</div>
    </div>
    <button id="restart">Restart</button>
  </div>
</div>
<script>
const COLS = 10, ROWS = 20, SIZE = 24;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const linesEl = document.getElementById('lines');
const engineToggle = document.getElementById('engineToggle');
const engineName = document.getElementById('engineName');

const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};
const COLORS = { I:'#00f0f0', O:'#f0f000', T:'#a000f0', S:'#00f000', Z:'#f00000', J:'#0000f0', L:'#f0a000' };

function drawCell(c, x, y, size, color) {
  c.fillStyle = color;
  c.fillRect(x * size, y * size, size, size);
  c.strokeStyle = 'rgba(0,0,0,0.4)';
  c.strokeRect(x * size, y * size, size, size);
}

/* ============================================================
   ENGINE A — Functional style (the original)
   ============================================================ */
const FunctionalEngine = (() => {
  let grid, current, nextPiece, score, lines, dropInterval, dropTimer, gameOver, lastTime, rafId;

  function createGrid() { return Array.from({length: ROWS}, () => Array(COLS).fill(null)); }
  function randomPiece() {
    const keys = Object.keys(SHAPES);
    const type = keys[Math.floor(Math.random() * keys.length)];
    const shape = SHAPES[type].map(r => [...r]);
    return { type, shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
  }
  function rotate(shape) {
    const rows = shape.length, cols = shape[0].length;
    const out = Array.from({length: cols}, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out[c][rows - 1 - r] = shape[r][c];
    return out;
  }
  function collide(piece, g) {
    for (let r = 0; r < piece.shape.length; r++) for (let c = 0; c < piece.shape[r].length; c++) {
      if (!piece.shape[r][c]) continue;
      const x = piece.x + c, y = piece.y + r;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && g[y][x]) return true;
    }
    return false;
  }
  function merge(piece) {
    piece.shape.forEach((row, r) => row.forEach((v, c) => { if (v) grid[piece.y + r][piece.x + c] = piece.type; }));
  }
  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(cell => cell)) { grid.splice(r, 1); grid.unshift(Array(COLS).fill(null)); cleared++; r++; }
    }
    if (cleared) {
      score += [0,100,300,500,800][cleared];
      lines += cleared;
      scoreEl.textContent = score; linesEl.textContent = lines;
    }
  }
  function spawn() {
    current = nextPiece || randomPiece();
    nextPiece = randomPiece();
    if (collide(current, grid)) gameOver = true;
    drawNext();
  }
  function move(dx) { current.x += dx; if (collide(current, grid)) current.x -= dx; }
  function drop() {
    current.y++;
    if (collide(current, grid)) { current.y--; merge(current); clearLines(); spawn(); }
    dropTimer = 0;
  }
  function hardDrop() {
    while (!collide(current, grid)) current.y++;
    current.y--; merge(current); clearLines(); spawn(); dropTimer = 0;
  }
  function rotateCurrent() {
    const rotated = rotate(current.shape), old = current.shape;
    current.shape = rotated;
    for (const k of [0,-1,1,-2,2]) { current.x += k; if (!collide(current, grid)) return; current.x -= k; }
    current.shape = old;
  }
  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, board.width, board.height);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c]) drawCell(ctx, c, r, SIZE, COLORS[grid[r][c]]);
    if (current && !gameOver) current.shape.forEach((row, r) => row.forEach((v, c) => { if (v) drawCell(ctx, current.x + c, current.y + r, SIZE, COLORS[current.type]); }));
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, board.width, board.height);
      ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', board.width / 2, board.height / 2);
    }
  }
  function drawNext() {
    nctx.fillStyle = '#000'; nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextPiece) return;
    const size = 24, shape = nextPiece.shape;
    const ox = (nextCanvas.width - shape[0].length * size) / 2;
    const oy = (nextCanvas.height - shape.length * size) / 2;
    nctx.save(); nctx.translate(ox, oy);
    shape.forEach((row, r) => row.forEach((v, c) => { if (v) drawCell(nctx, c, r, size, COLORS[nextPiece.type]); }));
    nctx.restore();
  }
  function loop(time) {
    if (!lastTime) lastTime = time;
    const dt = time - lastTime; lastTime = time;
    if (!gameOver) { dropTimer += dt; if (dropTimer > dropInterval) drop(); }
    draw();
    rafId = requestAnimationFrame(loop);
  }
  function onKey(e) {
    if (gameOver) return;
    switch (e.key) {
      case 'ArrowLeft': move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown': drop(); break;
      case 'ArrowUp': rotateCurrent(); break;
      case ' ': hardDrop(); e.preventDefault(); break;
    }
  }
  function start() {
    grid = createGrid(); score = 0; lines = 0;
    scoreEl.textContent = '0'; linesEl.textContent = '0';
    dropInterval = 700; dropTimer = 0; lastTime = 0; gameOver = false; nextPiece = null;
    spawn();
    rafId = requestAnimationFrame(loop);
    document.addEventListener('keydown', onKey);
  }
  function stop() {
    cancelAnimationFrame(rafId);
    document.removeEventListener('keydown', onKey);
  }
  return { start, stop, reset: () => { stop(); start(); } };
})();

/* ============================================================
   ENGINE B — Class-based style (deliberately different)
   ============================================================ */
class ClassEngine {
  constructor() {
    this.grid = null; this.active = null; this.next = null;
    this.score = 0; this.lines = 0;
    this.interval = 700; this.accum = 0; this.prev = 0;
    this.over = false; this.raf = null;
    this._boundKey = this._onKey.bind(this);
  }
  _emptyGrid() { return Array.from({length: ROWS}, () => Array(COLS).fill(null)); }
  _bag() {
    const keys = Object.keys(SHAPES);
    return keys[Math.floor(Math.random() * keys.length)];
  }
  _newPiece() {
    const type = this._bag();
    return { type, cells: SHAPES[type].map(r => [...r]), x: Math.floor((COLS - SHAPES[type][0].length) / 2), y: 0 };
  }
  _rotated(cells) {
    return cells[0].map((_, i) => cells.map(row => row[i]).reverse());
  }
  _hits(piece, g = this.grid) {
    return piece.cells.some((row, r) => row.some((v, c) => {
      if (!v) return false;
      const x = piece.x + c, y = piece.y + r;
      return x < 0 || x >= COLS || y >= ROWS || (y >= 0 && g[y][x]);
    }));
  }
  _lock() {
    this.active.cells.forEach((row, r) => row.forEach((v, c) => {
      if (v) this.grid[this.active.y + r][this.active.x + c] = this.active.type;
    }));
  }
  _sweep() {
    let n = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (this.grid[r].every(Boolean)) {
        this.grid.splice(r, 1);
        this.grid.unshift(Array(COLS).fill(null));
        n++; r++;
      }
    }
    if (n) {
      this.score += [0,100,300,500,800][n];
      this.lines += n;
      scoreEl.textContent = this.score;
      linesEl.textContent = this.lines;
    }
  }
  _spawn() {
    this.active = this.next || this._newPiece();
    this.next = this._newPiece();
    if (this._hits(this.active)) this.over = true;
    this._paintNext();
  }
  _shift(dx) {
    this.active.x += dx;
    if (this._hits(this.active)) this.active.x -= dx;
  }
  _softDrop() {
    this.active.y++;
    if (this._hits(this.active)) {
      this.active.y--;
      this._lock(); this._sweep(); this._spawn();
    }
    this.accum = 0;
  }
  _slam() {
    while (!this._hits(this.active)) this.active.y++;
    this.active.y--;
    this._lock(); this._sweep(); this._spawn();
    this.accum = 0;
  }
  _spin() {
    const before = this.active.cells;
    this.active.cells = this._rotated(before);
    for (const k of [0,-1,1,-2,2]) {
      this.active.x += k;
      if (!this._hits(this.active)) return;
      this.active.x -= k;
    }
    this.active.cells = before;
  }
  _paint() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, board.width, board.height);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (this.grid[r][c]) drawCell(ctx, c, r, SIZE, COLORS[this.grid[r][c]]);
    }
    if (this.active && !this.over) {
      this.active.cells.forEach((row, r) => row.forEach((v, c) => {
        if (v) drawCell(ctx, this.active.x + c, this.active.y + r, SIZE, COLORS[this.active.type]);
      }));
    }
    if (this.over) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, board.width, board.height);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', board.width / 2, board.height / 2);
    }
  }
  _paintNext() {
    nctx.fillStyle = '#000';
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!this.next) return;
    const s = 24, sh = this.next.cells;
    const ox = (nextCanvas.width - sh[0].length * s) / 2;
    const oy = (nextCanvas.height - sh.length * s) / 2;
    nctx.save();
    nctx.translate(ox, oy);
    sh.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawCell(nctx, c, r, s, COLORS[this.next.type]);
    }));
    nctx.restore();
  }
  _frame(t) {
    if (!this.prev) this.prev = t;
    const dt = t - this.prev;
    this.prev = t;
    if (!this.over) {
      this.accum += dt;
      if (this.accum > this.interval) this._softDrop();
    }
    this._paint();
    this.raf = requestAnimationFrame(this._frame.bind(this));
  }
  _onKey(e) {
    if (this.over) return;
    switch (e.key) {
      case 'ArrowLeft': this._shift(-1); break;
      case 'ArrowRight': this._shift(1); break;
      case 'ArrowDown': this._softDrop(); break;
      case 'ArrowUp': this._spin(); break;
      case ' ': this._slam(); e.preventDefault(); break;
    }
  }
  start() {
    this.grid = this._emptyGrid();
    this.score = 0; this.lines = 0;
    scoreEl.textContent = '0'; linesEl.textContent = '0';
    this.interval = 700; this.accum = 0; this.prev = 0;
    this.over = false; this.next = null;
    this._spawn();
    this.raf = requestAnimationFrame(this._frame.bind(this));
    document.addEventListener('keydown', this._boundKey);
  }
  stop() {
    cancelAnimationFrame(this.raf);
    document.removeEventListener('keydown', this._boundKey);
  }
  reset() { this.stop(); this.start(); }
}

/* ============================================================
   Engine switcher
   ============================================================ */
const classEngine = new ClassEngine();
let activeEngine = null;

function activate(engine) {
  if (activeEngine) activeEngine.stop();
  activeEngine = engine;
  activeEngine.start();
}

engineToggle.addEventListener('change', () => {
  const useClass = engineToggle.checked;
  engineName.textContent = useClass ? 'Class-based' : 'Functional';
  activate(useClass ? classEngine : FunctionalEngine);
});

document.getElementById('restart').addEventListener('click', () => {
  if (activeEngine) activeEngine.reset();
});

// default: functional
activate(FunctionalEngine);
</script>
</body>
</html>

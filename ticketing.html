<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketing System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Main Container -->
    <div class="max-w-[1400px] mx-auto p-6">
        
        <!-- Header Section -->
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Ticketing System</h1>
                <p class="text-sm text-gray-500 mt-1">Manage and track all support requests</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Create Ticket
            </button>
        </div>

        <!-- Toolbar (Search & Filters) -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
            <div class="relative w-full md:w-96">
                <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Search subject, customer, ID..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm">
            </div>
            
            <div class="flex gap-2 w-full md:w-auto">
                <select id="filterStatus" onchange="filterData()" class="border border-gray-300 rounded-md px-3 py-2 text-sm bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Closed">Closed</option>
                </select>
                <button class="border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-md text-sm font-medium shadow-sm transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                    Filters
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4">Ticket ID</th>
                            <th class="px-6 py-4">Subject</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Priority</th>
                            <th class="px-6 py-4">Assignee</th>
                            <th class="px-6 py-4">Created</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination / Footer -->
            <div class="px-6 py-3 bg-white border-t border-gray-200 flex items-center justify-between text-sm text-gray-600">
                <div class="flex items-center gap-2">
                    <span>Show</span>
                    <select id="rowsPerPage" onchange="changeRowsPerPage()" class="border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                    <span>entries</span>
                    <span class="ml-4 hidden sm:inline" id="tableInfo">Showing 1 to 4 of 4 entries</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="prevPage()" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" id="prevBtn">Previous</button>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" id="nextBtn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Ticket Modal -->
    <div id="ticketModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-900">Create New Ticket</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="createTicketForm" onsubmit="handleCreateTicket(event)" class="p-6 flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                    <input type="text" id="newSubject" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                        <select id="newPriority" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Assignee</label>
                        <input type="text" id="newAssignee" placeholder="e.g. John Doe" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description / Customer Info</label>
                    <textarea id="newDesc" rows="3" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="mt-4 flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium transition-colors shadow-sm">Submit Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // MOCK DATA & STATE (Ready for API Integration)
        // ==========================================
        let tickets = [
            { id: 'TKT-1024', subject: 'Cannot access dashboard (SSO timeout issue)', desc: 'Customer: Acme Corp', status: 'Open', priority: 'High', assignee: 'Alex Smith', created: '2 mins ago' },
            { id: 'TKT-1023', subject: 'Billing discrepancy for Q3 subscription', desc: 'Reported by: Michael Chen', status: 'In Progress', priority: 'Medium', assignee: 'David Kim', created: '1 hour ago' },
            { id: 'TKT-1022', subject: 'Feature request: Dark mode for mobile app', desc: 'Requested by: Sarah Jenkins', status: 'Closed', priority: 'Low', assignee: 'Unassigned', created: 'Yesterday' },
            { id: 'TKT-1021', subject: 'API Integration: Timeout errors', desc: 'Server Node: Cluster-B', status: 'Open', priority: 'High', assignee: 'Alex Smith', created: '2 days ago' }
        ];

        let filteredTickets = [...tickets];
        let currentPage = 1;
        let rowsPerPage = 5;

        // ==========================================
        // UI RENDERING
        // ==========================================
        
        function getStatusBadge(status) {
            const base = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium";
            switch(status) {
                case 'Open': return `<span class="${base} bg-yellow-100 text-yellow-800">Open</span>`;
                case 'In Progress': return `<span class="${base} bg-blue-100 text-blue-800">In Progress</span>`;
                case 'Closed': return `<span class="${base} bg-green-100 text-green-800">Closed</span>`;
                default: return `<span class="${base} bg-gray-100 text-gray-800">${status}</span>`;
            }
        }

        function getPriorityBadge(priority) {
            const base = "inline-flex items-center px-2 py-0.5 rounded text-xs font-medium";
            switch(priority) {
                case 'High': return `<span class="${base} text-red-600 bg-red-50 border border-red-100">High</span>`;
                case 'Medium': return `<span class="${base} text-blue-600 bg-blue-50 border border-blue-100">Medium</span>`;
                case 'Low': return `<span class="${base} text-green-600 bg-green-50 border border-green-100">Low</span>`;
                default: return priority;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filteredTickets.slice(start, end);

            if (paginatedItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">No tickets found.</td></tr>`;
            } else {
                paginatedItems.forEach(ticket => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition-colors";
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">${ticket.id}</td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-gray-900">${ticket.subject}</div>
                            <div class="text-xs text-gray-500 mt-0.5">${ticket.desc}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">${getStatusBadge(ticket.status)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${getPriorityBadge(ticket.priority)}</td>
                        <td class="px-6 py-4 text-gray-600 whitespace-nowrap">${ticket.assignee}</td>
                        <td class="px-6 py-4 text-gray-500 whitespace-nowrap">${ticket.created}</td>
                        <td class="px-6 py-4 text-right whitespace-nowrap">
                            <button onclick="alert('Viewing ${ticket.id}')" class="text-gray-400 hover:text-blue-600 transition-colors" title="View Details">
                                <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Update Pagination UI
            const total = filteredTickets.length;
            const showingStart = total === 0 ? 0 : start + 1;
            const showingEnd = Math.min(end, total);
            document.getElementById('tableInfo').textContent = `Showing ${showingStart} to ${showingEnd} of ${total} entries`;
            
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = end >= total;
        }

        // ==========================================
        // LOGIC & FILTERING
        // ==========================================

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;

            filteredTickets = tickets.filter(t => {
                const matchesSearch = t.id.toLowerCase().includes(query) || 
                                      t.subject.toLowerCase().includes(query) || 
                                      t.desc.toLowerCase().includes(query);
                const matchesStatus = statusFilter === '' || t.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            currentPage = 1;
            renderTable();
        }

        function changeRowsPerPage() {
            rowsPerPage = parseInt(document.getElementById('rowsPerPage').value);
            currentPage = 1;
            renderTable();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const maxPage = Math.ceil(filteredTickets.length / rowsPerPage);
            if (currentPage < maxPage) {
                currentPage++;
                renderTable();
            }
        }

        // ==========================================
        // MODAL CONTROLS
        // ==========================================

        function openModal() {
            document.getElementById('ticketModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('ticketModal').classList.add('hidden');
            document.getElementById('createTicketForm').reset();
        }

        function handleCreateTicket(e) {
            e.preventDefault();
            
            // Generate basic ID (In real API, backend handles this)
            const nextId = 'TKT-' + Math.floor(1000 + Math.random() * 9000);
            
            const newTicket = {
                id: nextId,
                subject: document.getElementById('newSubject').value,
                desc: document.getElementById('newDesc').value || 'No description provided',
                status: 'Open', // Default
                priority: document.getElementById('newPriority').value,
                assignee: document.getElementById('newAssignee').value || 'Unassigned',
                created: 'Just now'
            };

            /* 
            ==========================================
            API INTEGRATION POINT 
            ==========================================
            Instead of doing this locally, you would do:

            fetch('/api/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newTicket)
            })
            .then(res => res.json())
            .then(data => {
                tickets.unshift(data); // Add to top
                filterData();
                closeModal();
            });
            */

            // Local Fallback Execution:
            tickets.unshift(newTicket); // Add to top of array
            filterData(); // Re-render and reset to page 1
            closeModal();
            alert('Ticket Created Successfully!');
        }

        // Initial Render
        renderTable();
    </script>
</body>
</html>

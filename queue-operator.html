<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Management - Staff Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .queue-number { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- Top Header Bar -->
    <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            <h1 class="text-lg font-bold tracking-wide">STAFF CONTROL PANEL</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="connection-status" class="text-xs font-bold px-2 py-1 rounded bg-gray-700 text-gray-300">CONNECTING...</span>
            <span id="clock" class="font-mono text-lg text-white font-bold">00:00:00</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- Left Side: Focused Display Board -->
        <div class="flex-1 flex flex-col gap-4">
            
            <!-- Department Focus Card -->
            <div id="focusCard" class="flex-1 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col overflow-hidden relative transition-colors duration-300">
                <div id="focusCardHeader" class="bg-blue-600 px-6 py-3 flex justify-between items-center text-white transition-colors duration-300">
                    <h2 class="text-xl font-bold flex items-center gap-2" id="focusCardTitle">
                        FINANCE / CASHIER
                    </h2>
                    <span class="text-sm bg-black/20 px-3 py-1 rounded-full" id="focusWaitingCount">Waiting: 0</span>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center p-6">
                    <p class="text-gray-500 text-lg font-medium mb-2 uppercase tracking-widest">Now Serving</p>
                    <div id="focusNowServing" class="queue-number text-8xl font-extrabold text-blue-600 mb-2">---</div>
                    <p id="focusWindow" class="text-2xl font-semibold text-gray-700 mb-2">Window 1</p>

                    <span id="trackerStatusBadge"
                        class="hiddeninline-block px-4 py-1.5 rounded-full text-sm font-bold uppercase tracking-wide border bg-gray-100 text-gray-700 border-gray-300">
                        ---
                    </span>

                </div>
                <div class="bg-gray-50 border-t border-gray-200 px-6 py-4 flex justify-between items-center">
                    <span class="text-sm font-semibold text-gray-500 uppercase">Next in line</span>
                    <span id="focusNextPreview" class="text-xl font-bold text-gray-400">---</span>
                </div>
            </div>

            <!-- Other Department Quick Glance (Small) -->
            <div class="h-24 bg-white rounded-xl shadow border border-gray-200 flex items-center justify-between px-6 opacity-60 hidden">
                <div class="flex items-center gap-3">
                    <div id="otherDeptBadge" class="w-3 h-3 rounded-full bg-teal-500"></div>
                    <span id="otherDeptName" class="font-bold text-gray-600">REGISTRAR (GLOBAL)</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-gray-400 block uppercase">Serving Now</span>
                    <span id="otherDeptServing" class="text-xl font-bold text-gray-600">---</span>
                </div>
            </div>
        </div>

        <!-- Right Side: Staff Control Panel -->
        <div class="w-full md:w-96 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 rounded-t-xl">
                <h2 class="text-lg font-bold text-gray-800">Terminal Actions</h2>
                <p class="text-xs text-gray-500">Select your assigned Window & Dept below</p>
            </div>

            <div class="flex-1 p-6 flex flex-col gap-5 overflow-y-auto">
                
                <!-- Terminal Context Selection -->
                <div class="bg-blue-50 border border-blue-100 rounded-lg p-3">
                    <label class="block text-xs font-bold text-blue-800 uppercase tracking-wide mb-2">My Station</label>
                    <div class="flex gap-2">
                        <select id="callDept" onchange="updateLocalContext()" class="flex-1 border border-blue-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-semibold text-blue-900">
                            <option value="finance">Finance</option>
                            <option value="registrar">Registrar</option>
                        </select>
                        <select id="callWindow" onchange="updateLocalContext()" class="flex-1 border border-blue-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-semibold text-blue-900">
                            <!-- Populated by JS based on Dept -->
                        </select>
                    </div>
                </div>

                <hr class="border-gray-200">

                <!-- Call Next Form -->
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">Action</h3>
                    <div class="flex flex-col gap-2">
                        <button id="callNextBtn" onclick="callNext()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition-colors text-lg shadow-md">
                            Call Next Number
                        </button>
                        <button onclick="clearWindow()" class="w-full bg-red-50 hover:bg-red-100 text-red-700 font-bold py-2 px-4 rounded-md transition-colors text-sm border border-red-200">
                            Clear / Reset Window
                        </button>
                    </div>
                </div>

                <hr class="border-gray-200">

                <!-- Status Management -->
                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">Update Ticket Status</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="updateStatus('processing')" class="bg-orange-50 hover:bg-orange-100 text-orange-700 font-bold py-2 rounded-md text-sm border border-orange-200 transition-colors">
                            Processing
                        </button>
                        <button onclick="updateStatus('hold')" class="bg-cyan-50 hover:bg-cyan-100 text-cyan-700 font-bold py-2 rounded-md text-sm border border-cyan-200 transition-colors">
                            On Hold
                        </button>
                        <button onclick="updateStatus('closed')" class="col-span-2 bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 rounded-md text-sm shadow-sm transition-colors">
                            Close Transaction
                        </button>
                    </div>
                </div>

                <hr class="border-gray-200">

                <!-- On Hold Section (Only shows if there are held tickets) -->
                <div id="holdSection" class="hidden">
                    <h3 class="text-sm font-bold text-cyan-700 mb-2 uppercase tracking-wide flex justify-between">
                        <span>On Hold Tickets</span>
                    </h3>
                    <div id="holdList" class="flex flex-col gap-2 bg-cyan-50 p-2 rounded-lg border border-cyan-100">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Active Queues List (Filtered) -->
                <div class="flex-1 flex flex-col min-h-[150px]">
                    <h3 class="text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide flex justify-between">
                        <span>Waiting List</span>
                        <span id="queueTypeLabel" class="text-blue-600">(Finance)</span>
                    </h3>
                    <div id="waitingList" class="flex flex-col gap-2 overflow-y-auto pr-1">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'http://localhost:3000'; 
        const statusEl = document.getElementById('connection-status');
        let globalState = null;

        // Define which windows belong to which department
        const DEPT_WINDOWS = {
            finance: ['Window 1', 'Window 2'],
            registrar: ['Window 1', 'Window 2']
        };

        // ==========================================
        // 1. SSE CONNECTION
        // ==========================================
        const evtSource = new EventSource(`/api/queue-stream`);

        evtSource.onopen = () => {
            statusEl.textContent = 'LIVE (CONNECTED)';
            statusEl.className = 'text-xs font-bold px-2 py-1 rounded bg-green-900 text-green-300 border border-green-700';
        };

        evtSource.onerror = () => {
            statusEl.textContent = 'DISCONNECTED (RETRYING)';
            statusEl.className = 'text-xs font-bold px-2 py-1 rounded bg-red-900 text-red-300 border border-red-700';
        };

        evtSource.onmessage = (event) => {
            console.log('Received SSE update:', event.data);
            globalState = JSON.parse(event.data);
            renderTerminal();
        };

        // ==========================================
        // 2. LOCAL CONTEXT & RENDERING
        // ==========================================
        
        function updateLocalContext() {
            const dept = document.getElementById('callDept').value;
            const windowSelect = document.getElementById('callWindow');
            const selectedWindow = windowSelect.value;
            console.log(dept, selectedWindow, DEPT_WINDOWS[dept]);
            console.log(windowSelect.value, dept, DEPT_WINDOWS[dept]);

            // Repopulate windows based on selected dept
            windowSelect.innerHTML = '';
            DEPT_WINDOWS[dept].forEach(win => {
                const option = document.createElement('option');
                option.value = win;
                option.textContent = win;
                if(selectedWindow === win) option.selected = true;
                windowSelect.appendChild(option);
            });

            renderTerminal();
        }

        function renderTerminal() {
            if (!globalState) return;

            const dept = document.getElementById('callDept').value;
            const window = document.getElementById('callWindow').value;
            
            const deptData = globalState[dept];
            const windowData = deptData.activeWindows.find(w => w.window === window);
            const otherDept = dept === 'finance' ? 'registrar' : 'finance';
            const otherData = globalState[otherDept];

            // --- A. Update the Focus Card (Colors & Text) ---
            const focusHeader = document.getElementById('focusCardHeader');
            const focusTitle = document.getElementById('focusCardTitle');
            const focusNumber = document.getElementById('focusNowServing');
            const focusWindowText = document.getElementById('focusWindow');
            const callNextBtn = document.getElementById('callNextBtn');
            const queueLabel = document.getElementById('queueTypeLabel');

            if (dept === 'finance') {
                focusHeader.className = 'bg-blue-600 px-6 py-3 flex justify-between items-center text-white';
                focusTitle.textContent = 'FINANCE / CASHIER';
                focusNumber.className = 'queue-number text-8xl font-extrabold text-blue-600 mb-2';
                callNextBtn.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition-colors text-lg shadow-md';
                queueLabel.textContent = '(Finance)';
                queueLabel.className = 'text-blue-600';
            } else {
                focusHeader.className = 'bg-teal-600 px-6 py-3 flex justify-between items-center text-white';
                focusTitle.textContent = 'REGISTRAR';
                focusNumber.className = 'queue-number text-8xl font-extrabold text-teal-600 mb-2';
                callNextBtn.className = 'w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-md transition-colors text-lg shadow-md';
                queueLabel.textContent = '(Registrar)';
                queueLabel.className = 'text-teal-600';
            }

            // Update Card Data (Based on selected Window)
            focusNumber.textContent = windowData?.number || '---';
            focusWindowText.textContent = window;

            const badge = document.getElementById('trackerStatusBadge');
            badge.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold uppercase tracking-wide border';
            switch (windowData?.status) {
                case 'calling':
                    badge.textContent = `Calling`;
                    badge.classList.add('bg-yellow-100', 'text-yellow-700', 'border-yellow-400', 'animate-pulse');
                    badge.classList.remove('hidden');
                    break;

                case 'processing':
                    badge.textContent = `Processing`;
                    badge.classList.add('bg-orange-100', 'text-orange-700', 'border-orange-400');
                    badge.classList.remove('hidden');
                    break;

                case 'void':
                    badge.textContent = 'Voided';
                    badge.classList.add('bg-red-100', 'text-red-700', 'border-red-400');
                    badge.classList.remove('hidden');
                    break;

                case 'closed':
                    badge.textContent = 'Closed';
                    badge.classList.add('bg-gray-200', 'text-gray-600', 'border-gray-300');
                    badge.classList.remove('hidden');
                    break;
                default:
                    badge.classList.add('hidden');
            }
            
            document.getElementById('focusWaitingCount').textContent = `Waiting: ${deptData.queue ? deptData.queue.length : 0}`;
            document.getElementById('focusNextPreview').textContent = deptData.queue && deptData.queue.length > 0 ? deptData.queue[0].number : '---';

            // --- B. Update Other Dept Glance ---
            document.getElementById('otherDeptName').textContent = `${otherDept.toUpperCase()} (GLOBAL)`;
            document.getElementById('otherDeptBadge').className = `w-3 h-3 rounded-full ${otherDept === 'finance' ? 'bg-blue-500' : 'bg-teal-500'}`;
            document.getElementById('otherDeptServing').textContent = otherData.current || '---';

            // --- C. Render Filtered Waiting List ---
            const listContainer = document.getElementById('waitingList');
            listContainer.innerHTML = '';
            const activeQueue = deptData.queue || [];

            if (activeQueue.length === 0) {
                listContainer.innerHTML = `<p class="text-sm text-gray-400 italic text-center py-4">No customers waiting.</p>`;
            } else {
                activeQueue.forEach((item, index) => {
                    listContainer.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-gray-50 border border-gray-200 rounded text-sm shadow-sm">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-gray-800">${item.number}</span>
                                <span class="text-xs text-gray-500 truncate max-w-[100px]" title="${item.transaction}">${item.transaction}</span>
                            </div>
                            <span class="text-xs font-bold ${dept === 'finance' ? 'text-blue-600' : 'text-teal-600'}">#${index + 1}</span>
                        </div>
                    `;
                });
            }

            // --- D. Render Held Tickets ---
            const holdSection = document.getElementById('holdSection');
            const holdList = document.getElementById('holdList');
            holdList.innerHTML = '';

            // Filter held tickets for this department AND this window
            const heldTickets = (deptData.heldTickets || []).filter(t => t.window === window);

            if (heldTickets.length > 0) {
                holdSection.classList.remove('hidden');
                heldTickets.forEach(ticket => {
                    holdList.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-white border border-cyan-200 rounded text-sm shadow-sm">
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-800">${ticket.number}</span>
                                <span class="text-[10px] text-gray-500">${ticket.transaction}</span>
                            </div>
                            <button onclick="resumeTicket('${ticket.number}')" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold py-1 px-2 rounded transition-colors">
                                Resume
                            </button>
                        </div>
                    `;
                });
            } else {
                holdSection.classList.add('hidden');
            }
        }

        // ==========================================
        // 3. API ACTIONS
        // ==========================================
        
        function getContext() {
            return {
                dept: document.getElementById('callDept').value,
                window: document.getElementById('callWindow').value
            };
        }

        async function callNext() {
            const { dept, window } = getContext();
            try {
                const res = await fetch(`/api/call-next`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dept, window })
                });
                if (!res.ok) {
                    const errorData = await res.json();
                    alert(errorData.message || "Failed to call next.");
                }
            } catch (err) {
                alert("Error connecting to server.");
            }
        }

        async function updateStatus(status) {
            const { dept, window } = getContext();
            try {
                const res = await fetch(`/api/update-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dept, window, status })
                });
                if (!res.ok) {
                    const error = await res.json();
                    alert(error.message || "Failed to update status.");
                }
            } catch (err) {
                alert("Error connecting to server.");
            }
        }

        async function resumeTicket(ticketNumber) {
            const { dept, window } = getContext();
            try {
                const res = await fetch(`/api/resume-ticket`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dept, window, ticketNumber })
                });
                if (!res.ok) {
                    const error = await res.json();
                    alert(error.message || "Failed to resume ticket.");
                }
            } catch (err) {
                alert("Error connecting to server.");
            }
        }

        async function clearWindow() {
            console.log(getContext(), globalState);
            const { dept, window } = getContext();
            if (!confirm(`Are you sure you want to clear ${window}? The current ticket may will be VOIDED.`)) return;

            try {
                const res = await fetch(`/api/clear-window`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dept, window })
                });
                if (!res.ok) throw new Error('Failed to clear window');
            } catch (err) {
                alert("Error connecting to server.");
            }
        }

        // ==========================================
        // 4. CLOCK & INIT
        // ==========================================
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
        }, 1000);
        
        // Initial call to set default UI state and populate windows
        updateLocalContext();
    </script>
</body>
</html>
